{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><h1 class="h2 mb-4">{{ heading }}</h1><div class="card"><div class="card-body p-4"><form method="post">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<div class="mb-3"><label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field.errors }}{{ field.as_widget|safe }}{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}</div>{% endfor %}<button class="btn btn-primary">Submit ticket</button> <a class="btn btn-outline-secondary" href="{% url 'tickets:list' %}">Cancel</a></form></div></div></div></div>{% endblock %}
