{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-9"><a href="{% url 'kb:list' %}">← Knowledge base</a><div class="text-primary small mt-3">{{ article.category.name|default:'General' }}</div><h1 class="h2 mt-2">{{ article.title }}</h1><p class="lead text-muted">{{ article.summary }}</p><div class="text-muted small mb-4">Written by {{ article.author.email }} · Updated {{ article.updated_at|date:'M j, Y' }}</div><div class="card"><div class="card-body p-4 preserve-lines">{{ article.content }}</div></div></div></div>{% endblock %}
