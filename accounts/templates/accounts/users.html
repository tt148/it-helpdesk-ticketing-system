{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between mb-4"><h1 class="h2">User management</h1><a class="btn btn-primary" href="{% url 'accounts:user_create' %}">+ Add user</a></div><div class="card"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>User</th><th>Role</th><th>Active</th><th></th></tr></thead><tbody>{% for item in users %}<tr><td><strong>{{ item.get_full_name|default:item.username }}</strong><div class="small text-muted">{{ item.email }}</div></td><td>{{ item.get_role_display }}</td><td>{% if item.is_active %}<span class="badge text-bg-success">Active</span>{% else %}<span class="badge text-bg-secondary">Inactive</span>{% endif %}</td><td><a href="{% url 'accounts:user_edit' item.pk %}">Edit</a></td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
